<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TrendLens — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/tokens.css">
  <style>
    :root {
      /* login-specific semantic aliases */
      --green-dim: rgba(34,197,94,0.12);
      --green-brd: rgba(34,197,94,0.35);
      --r-card: var(--r);
    }

    header {
      position: sticky; top: 0; z-index: 10;
      height: var(--header-h);
      background: rgba(19,19,20,0.95); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 32px;
    }

    .page { display: flex; align-items: center; justify-content: center; padding: 48px 24px 80px; min-height: calc(100vh - var(--header-h)); }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      width: 100%; max-width: 420px;
      display: flex; flex-direction: column; gap: 28px;
    }

    .card-header { display: flex; flex-direction: column; gap: 6px; }
    .card-header h1 { font-family: "Plus Jakarta Sans", sans-serif; font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
    .card-header p { font-size: 14px; color: var(--text2); line-height: 1.5; }


    .btn-login {
      width: 100%; padding: 14px;
      border-radius: var(--r-pill);
      background: var(--green);
      color: #000; font-size: 15px; font-weight: 700;
      border: none; cursor: pointer;
      font-family: "Plus Jakarta Sans", sans-serif;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn-login:hover { opacity: 0.9; }
    .btn-login:active { transform: scale(0.99); }

    .error-banner {
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: var(--r-card);
      padding: 12px 16px;
      font-size: 13px; color: #f87171;
      display: none;
    }
    .error-banner.visible { display: block; }

    .footer-note { font-size: 13px; color: var(--text2); text-align: center; }
    .footer-note a { color: var(--green); text-decoration: none; font-weight: 600; }
    .footer-note a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<header>
  <a href="/" class="logo">
    <div class="logo-icon">◈</div>
    <div class="logo-text">TrendLens</div>
  </a>
</header>

<div class="page">
  <div class="card">

    <div class="card-header">
      <h1>Sign in</h1>
      <p>Welcome back. Sign in to see your trend signals.</p>
    </div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div style="display:flex;flex-direction:column;gap:16px;">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@company.com" autocomplete="email" required/>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required/>
        </div>

        <div class="error-banner" id="error-banner" role="alert"></div>

        <button type="submit" class="btn-login" id="submit-btn">Sign in →</button>
      </div>
    </form>

    <div class="footer-note">Don't have an account? <a href="/signup.html">Create one</a></div>

  </div>
</div>

<script>
  async function handleLogin(e) {
    e.preventDefault();

    const btn    = document.getElementById('submit-btn');
    const banner = document.getElementById('error-banner');
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    // Reset
    banner.textContent = '';
    banner.classList.remove('visible');
    btn.disabled = true;
    btn.textContent = 'Signing in…';

    try {
      const body = new URLSearchParams({ email, password });
      const res  = await fetch('/login', { method: 'POST', body, redirect: 'follow' });

      if (res.ok || res.redirected) {
        window.location.href = res.url || '/app';
        return;
      }

      const data = await res.json().catch(() => ({}));
      const msg  = data.detail || 'Something went wrong. Please try again.';
      banner.textContent = res.status === 401 ? 'Incorrect email or password.' : msg;
      banner.classList.add('visible');
    } catch {
      banner.textContent = 'Network error — please check your connection.';
      banner.classList.add('visible');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Sign in →';
    }
  }

  // Submit on Enter in either field
  ['email', 'password'].forEach(id =>
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') handleLogin(e);
    })
  );
</script>

</body>
</html>
