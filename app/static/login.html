<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TrendLens — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #131314;
      --surface:   #1C1C1F;
      --border:    #2D2D30;
      --text:      #e5e2e3;
      --text2:     #94A3B8;
      --green:     #22C55E;
      --green-dim: rgba(34,197,94,0.12);
      --green-brd: rgba(34,197,94,0.35);
      --purple:    #818CF8;
      --r-card:    12px;
      --r-pill:    999px;
    }

    html, body { width: 100%; min-height: 100vh; }
    body { font-family: "Inter", sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }

    header {
      position: sticky; top: 0; z-index: 10;
      height: 64px;
      background: rgba(19,19,20,0.95); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 32px;
    }
    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
    .logo-icon { width: 30px; height: 30px; border-radius: 8px; background: var(--green); display: flex; align-items: center; justify-content: center; font-size: 15px; }
    .logo-text { font-family: "Plus Jakarta Sans", sans-serif; font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }

    .page { display: flex; align-items: center; justify-content: center; padding: 48px 24px 80px; min-height: calc(100vh - 64px); }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      width: 100%; max-width: 420px;
      display: flex; flex-direction: column; gap: 28px;
    }

    .card-header { display: flex; flex-direction: column; gap: 6px; }
    .card-header h1 { font-family: "Plus Jakarta Sans", sans-serif; font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
    .card-header p { font-size: 14px; color: var(--text2); line-height: 1.5; }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 12px; font-weight: 600; color: var(--text2); }
    .field input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--r-card);
      padding: 12px 14px;
      font-size: 14px; color: var(--text);
      font-family: "Inter", sans-serif;
      outline: none; width: 100%;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field input::placeholder { color: var(--text2); }
    .field input:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(129,140,248,0.12); }

    .btn-login {
      width: 100%; padding: 14px;
      border-radius: var(--r-pill);
      background: var(--green);
      color: #000; font-size: 15px; font-weight: 700;
      border: none; cursor: pointer;
      font-family: "Plus Jakarta Sans", sans-serif;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn-login:hover { opacity: 0.9; }
    .btn-login:active { transform: scale(0.99); }

    .error-banner {
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: var(--r-card);
      padding: 12px 16px;
      font-size: 13px; color: #f87171;
      display: none;
    }
    .error-banner.visible { display: block; }

    .footer-note { font-size: 13px; color: var(--text2); text-align: center; }
    .footer-note a { color: var(--green); text-decoration: none; font-weight: 600; }
    .footer-note a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<header>
  <a href="/" class="logo">
    <div class="logo-icon">◈</div>
    <div class="logo-text">TrendLens</div>
  </a>
</header>

<div class="page">
  <div class="card">

    <div class="card-header">
      <h1>Sign in</h1>
      <p>Welcome back. Sign in to see your trend signals.</p>
    </div>

    <form method="POST" action="/login" id="login-form">
      <div style="display:flex;flex-direction:column;gap:16px;">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" value="demo@trendlens.com" required/>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" value="demo1234" required/>
        </div>

        <div class="error-banner" id="error-banner"></div>

        <button type="submit" class="btn-login">Sign in →</button>
      </div>
    </form>

    <div class="footer-note">Don't have an account? <a href="/signup.html">Create one</a></div>

  </div>
</div>

</body>
</html>
